name: xue_hua_navite_rapid_ocr
description: "Check out xue_hua_navite_rapid_ocr — a full-featured 6-platform native & Web offline RapidOCR (PP-OCRv4/PP-OCRv5 ONNX) plugin for Flutter with Live Text overlay! (Author: Matkurban <3496354336@qq.com>)"
version: 1.0.0
homepage: https://github.com/Matkurban/xue_hua_navite_rapid_ocr
repository: https://github.com/Matkurban/xue_hua_navite_rapid_ocr
issue_tracker: https://github.com/Matkurban/xue_hua_navite_rapid_ocr/issues

topics:
  - ocr
  - rapidocr
  - onnxruntime
  - paddleocr
  - live-text

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  material_ui: ^1.8.0
  plugin_platform_interface: ^2.1.8
  ffi: ^2.2.0

dev_dependencies:
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: XueHuaNaviteRapidOcrWebPlugin
        fileName: xue_hua_navite_rapid_ocr_web.dart

  assets:
    # Shared RapidOCR ONNX models + dictionaries (download via scripts/download_models.sh)
    - assets/models/ch_ppocr_mobile_v2.0_cls_infer.onnx
    - assets/models/ch_PP-OCRv4_det_infer.onnx
    - assets/models/ch_PP-OCRv4_rec_infer.onnx
    - assets/models/ppocr_keys_v1.txt
    - assets/models/en_PP-OCRv4_rec_infer.onnx
    - assets/models/en_dict.txt
    - assets/models/Multilingual_PP-OCRv3_det_infer.onnx
    - assets/models/japan_PP-OCRv4_rec_infer.onnx
    - assets/models/japan_dict.txt
    - assets/models/korean_PP-OCRv4_rec_infer.onnx
    - assets/models/korean_dict.txt
    - assets/models/latin_PP-OCRv3_rec_infer.onnx
    - assets/models/latin_dict.txt
    - assets/models/cyrillic_PP-OCRv3_rec_infer.onnx
    - assets/models/cyrillic_dict.txt
    - assets/models/arabic_PP-OCRv4_rec_infer.onnx
    - assets/models/arabic_dict.txt

