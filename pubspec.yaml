name: xue_hua_navite_rapid_ocr
description: "Check out xue_hua_navite_rapid_ocr — a full-featured 6-platform native & Web offline RapidOCR v3.10.0 (PP-OCRv4/PP-OCRv5 ONNX) plugin for Flutter with Live Text overlay! (Author: Matkurban <3496354336@qq.com>)"
version: 1.0.0
homepage: https://github.com/Matkurban/xue_hua_navite_rapid_ocr
repository: https://github.com/Matkurban/xue_hua_navite_rapid_ocr
issue_tracker: https://github.com/Matkurban/xue_hua_navite_rapid_ocr/issues

topics:
  - ocr
  - rapidocr
  - onnxruntime
  - paddleocr
  - live-text

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  material_ui: ^1.8.0
  plugin_platform_interface: ^2.1.8
  ffi: ^2.2.0
  crypto: ^3.0.6
  http: ^1.5.0
  path: ^1.9.1

dev_dependencies:
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

executables:
  fetch_runtime: fetch_runtime

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: XueHuaNaviteRapidOcrWebPlugin
        fileName: xue_hua_navite_rapid_ocr_web.dart

  assets:
    # ONNX weights live here after `dart run xue_hua_navite_rapid_ocr:fetch_runtime --models`
    # (*.onnx gitignored). Dictionaries are runtime downloads via OcrDictionaryStore.
    - assets/models/
