publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  xue_hua_file_operations: ^1.5.2
  xue_hua_navite_rapid_ocr:
    path: ../
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
